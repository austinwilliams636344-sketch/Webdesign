<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="Semi truck placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".55" r=".6"><stop offset="0" stop-color="#d31f26" stop-opacity=".22"/><stop offset="1" stop-color="#d31f26" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#161616"/></linearGradient>
  </defs>
  <rect width="800" height="640" fill="url(#bg)"/>
  <rect width="800" height="640" fill="url(#glow)"/>
  <!-- road -->
  <rect y="508" width="800" height="132" fill="#0c0c0c"/>
  <path d="M0 508h800" stroke="#2c2c2c" stroke-width="2"/>
  <path d="M20 575h80M160 575h80M300 575h80M440 575h80M580 575h80M720 575h80" stroke="#3a3a3a" stroke-width="6"/>
  <!-- trailer -->
  <rect x="440" y="190" width="400" height="262" fill="url(#body)" stroke="#353535" stroke-width="2"/>
  <path d="M440 236h400M440 406h400" stroke="#262626" stroke-width="2"/>
  <rect x="440" y="452" width="400" height="10" fill="#101010"/>
  <!-- sleeper -->
  <path d="M258 236h168v216H258z" fill="url(#body)" stroke="#353535" stroke-width="2"/>
  <path d="M276 262h72v42h-72z" fill="#0f0f0f" stroke="#2f2f2f"/>
  <!-- cab -->
  <path d="M104 452V362l34-22 34-92 86-18v222z" fill="url(#body)" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M182 262l66-14v84h-94z" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M200 262l10 70" stroke="#1c1c1c" stroke-width="3"/>
  <!-- grille + bumper -->
  <path d="M92 366h16v78H92z" fill="#202020" stroke="#3a3a3a"/>
  <path d="M95 376h10M95 388h10M95 400h10M95 412h10M95 424h10" stroke="#3d3d3d" stroke-width="3"/>
  <rect x="84" y="444" width="44" height="14" fill="#262626"/>
  <rect x="96" y="352" width="18" height="9" fill="#e9e9e9" opacity=".85"/>
  <!-- stacks -->
  <rect x="246" y="138" width="10" height="100" fill="#3a3a3a"/>
  <rect x="244" y="132" width="14" height="8" fill="#4a4a4a"/>
  <!-- red stripe -->
  <path d="M104 398h322v8H104z" fill="#d31f26"/>
  <path d="M104 412h322v3H104z" fill="#d31f26" opacity=".6"/>
  <!-- fuel tank -->
  <rect x="270" y="440" width="96" height="30" rx="14" fill="#2f2f2f" stroke="#444"/>
  <!-- wheels -->
  <g fill="#090909" stroke="#3a3a3a" stroke-width="3">
    <circle cx="176" cy="472" r="38"/><circle cx="356" cy="472" r="38"/><circle cx="440" cy="472" r="38"/>
    <circle cx="640" cy="472" r="38"/><circle cx="724" cy="472" r="38"/>
  </g>
  <g fill="#2b2b2b" stroke="#555" stroke-width="2">
    <circle cx="176" cy="472" r="14"/><circle cx="356" cy="472" r="14"/><circle cx="440" cy="472" r="14"/>
    <circle cx="640" cy="472" r="14"/><circle cx="724" cy="472" r="14"/>
  </g>
  <text x="28" y="618" fill="#4a4a4a" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">PHOTO PLACEHOLDER — REPLACE images/hero-truck.svg</text>
</svg>
